# /etc/console/sway.conf — généré par console-ux481 (réécrit à chaque installation).
# Compositeur en mode « console » : une application plein écran à la fois,
# pas de décorations, pas de barre. L'écran d'accueil et la manette sont gérés
# par console-shell (service utilisateur).

set $bin @@PREFIX@@/bin

# --- Apparence ---------------------------------------------------------------
default_border none
default_floating_border none
titlebar_border_thickness 0
titlebar_padding 1
gaps inner 0
gaps outer 0
output * bg #05070d solid_color
# Sorties : TV en HDMI seulement (calculé au démarrage, puis géré par le shell).
include /run/user/@@CONSOLE_UID@@/console-outputs.conf

# --- Comportement --------------------------------------------------------------
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
popup_during_fullscreen smart
workspace_auto_back_and_forth no
seat * hide_cursor 2500
seat * hide_cursor when-typing enable
xwayland enable

# --- Entrées -------------------------------------------------------------------
input type:keyboard {
    xkb_layout "@@XKB_LAYOUT@@"
    xkb_variant "@@XKB_VARIANT@@"
    xkb_options "@@XKB_OPTIONS@@"
    xkb_numlock enabled
}
# Capot fermé : écran tactile, ScreenPad et pavé tactile ignorés.
input type:touch events disabled
input type:tablet_tool events disabled
input type:tablet_pad events disabled
input type:touchpad events disabled

# --- Fenêtres --------------------------------------------------------------------
# L'accueil vit sur son propre espace de travail ; chaque application aussi
# (le shell s'en occupe). Toute fenêtre « normale » occupe tout l'écran,
# les boîtes de dialogue restent flottantes par-dessus.
assign [app_id="^console-home$"] workspace home
for_window [tiling] fullscreen enable
for_window [app_id="^console-home$"] fullscreen disable
for_window [window_type="dialog"] fullscreen disable, floating enable
for_window [window_role="(?i)^(dialog|pop-?up|bubble)$"] floating enable

# --- Touches (clavier de secours / dépannage) -----------------------------------
# Bouton Xbox reçu comme touche « Home » (manette sans xpadneo) :
bindsym --no-repeat XF86HomePage exec $bin/console-ctl guide
bindsym --no-repeat Super_L exec $bin/console-ctl guide
bindsym --no-repeat XF86PowerOff exec $bin/console-ctl power-button
bindsym XF86AudioRaiseVolume exec $bin/console-ctl volume +5
bindsym XF86AudioLowerVolume exec $bin/console-ctl volume -5
bindsym XF86AudioMute exec $bin/console-ctl volume mute
# Terminal de secours, retour accueil, redémarrage de l'interface :
bindsym Ctrl+Alt+Return exec foot
bindsym Ctrl+Alt+Escape exec $bin/console-ctl home
bindsym Ctrl+Alt+BackSpace exec systemctl --user restart console-shell.service

# --- Démarrage ---------------------------------------------------------------------
include /etc/sway/config.d/*
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QT_QPA_PLATFORM LIBVA_DRIVER_NAME SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS && systemctl --user start console-session.target
# Inactivité clavier/souris (la manette est suivie par le shell lui-même) :
exec swayidle -w timeout 20 '$bin/console-ctl seat-idle' resume '$bin/console-ctl seat-active'
