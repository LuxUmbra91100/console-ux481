<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Notifications</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html { font-size: 20px; }
    #stack { position: fixed; top: 0; right: 0; left: 0; display: flex; flex-direction: column; align-items: flex-end; gap: .7rem; padding: .4rem; }
    .toast { display: flex; align-items: center; gap: 1rem; min-width: 20rem; max-width: 30rem; padding: .95rem 1.3rem .95rem 1rem;
      border-radius: 1.2rem; background: rgba(15, 20, 36, .96); box-shadow: 0 1rem 2.6rem rgba(0, 0, 0, .55), inset 0 0 0 1px var(--line);
      animation: tin .38s var(--ease-out); }
    .toast.out { animation: tout .3s forwards; }
    @keyframes tin { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes tout { to { transform: translateX(110%); opacity: 0; } }
    .toast .ic { width: 2.6rem; height: 2.6rem; border-radius: .8rem; display: grid; place-items: center; flex: none;
      background: linear-gradient(135deg, #7c5cff, #2b6cff); }
    .toast .ic.warning { background: linear-gradient(135deg, #f59e0b, #dc2626); }
    .toast .ic .icon { width: 1.4rem; height: 1.4rem; }
    .toast b { display: block; font-size: 1rem; }
    .toast span { display: block; font-size: .82rem; color: var(--text-2); margin-top: .1rem; }
  </style>
</head>
<body class="transparent">
  <div id="stack"></div>
  <script src="common.js"></script>
  <script>
    const ICON_FOR = { gamepad: 'gamepad', warning: 'warning', info: 'info', save: 'save', camera: 'camera', pin: 'pin', volume: 'volume' };
    const active = new Set();
    function dismiss(el) {
      if (!active.has(el)) return;
      active.delete(el);
      el.classList.add('out');
      setTimeout(() => { el.remove(); if (!active.size) Shell.send('toast-done'); }, 300);
    }
    Shell.on('toast', t => {
      const el = h(`<div class="toast"><div class="ic ${t.icon === 'warning' ? 'warning' : ''}">${icon(ICON_FOR[t.icon] || 'info')}</div>
        <div><b>${esc(t.text)}</b>${t.sub ? `<span>${esc(t.sub)}</span>` : ''}</div></div>`);
      $('#stack').prepend(el);
      active.add(el);
      [...active].slice(0, -2).forEach(dismiss);
      setTimeout(() => dismiss(el), t.ms || 3200);
    });
  </script>
</body>
</html>
